<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XO Еда: запись с фото</title>
<style>
:root{
  --font:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --page:#ECE8DF; --bg:#F6F3EC; --ink:#171614; --muted:#6E6A62; --line:#DCD7CC; --track:#E3DED3; --accent:#2D64D2; --bezel:#1B1A18; --scrim:rgba(23,22,20,.38);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#0C0C0B;--bg:#141413;--ink:#ECE9E2;--muted:#8C887F;--line:#2B2A27;--track:#252422;--accent:#6E9BEB;--bezel:#222120;--scrim:rgba(0,0,0,.55)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--font);font-feature-settings:"tnum";-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{padding:20px 28px 0;max-width:860px}.top p{margin:6px 0 0;color:var(--muted)}
.layout{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;padding:20px 28px 48px}
.col{width:360px}
.col h2{font-size:15px;font-weight:600;margin:0 0 2px}
.col .sub{color:var(--muted);font-size:13px;margin:0 0 12px;min-height:58px}
.device{width:360px;height:700px;padding:8px;border-radius:44px;background:var(--bezel);box-shadow:0 0 0 1px var(--line)}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg)}
.pad{padding:50px 24px 0}
.ttl{font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.date{font-size:13px;color:var(--muted);margin-top:3px}
.sec{font-size:13px;color:var(--muted);margin:26px 0 10px}
.row{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid var(--line);width:100%}
.row:last-of-type{border-bottom:1px solid var(--line)}
.row .tm{width:40px;flex:0 0 40px;font-size:13px;color:var(--muted)}
.row .th{width:44px;height:44px;flex:0 0 44px;border-radius:10px;overflow:hidden;background:var(--track)}
.row .th.none{background:transparent;border:1px dashed var(--line)}
.row .nm{flex:1;min-width:0}
.row .nm div{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;font-size:12px;color:var(--muted)}
.row b{font-weight:500;font-size:15px}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
svg.ph{width:100%;height:100%;display:block}
.ink{stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* значки */
.ic{width:22px;height:22px;stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.circ{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
/* общие слои */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .28s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.ease{transition:transform .38s cubic-bezier(.2,0,0,1),opacity .25s}
.info .big{font-size:48px;font-weight:500;letter-spacing:-.035em;line-height:1;display:flex;align-items:baseline;gap:6px}
.info .big small{font-size:20px;color:var(--muted);font-weight:400;letter-spacing:0}
.info .name{font-size:20px;font-weight:600;letter-spacing:-.01em}
.info .when{font-size:13px;color:var(--muted);margin-top:2px}
.mac{display:flex;margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mac div{flex:1;padding:10px 0}.mac div+div{padding-left:14px;border-left:1px solid var(--line)}
.mac b{display:block;font-size:17px;font-weight:500}.mac span{font-size:12px;color:var(--muted)}
.score{margin-top:14px}
.score .r{display:flex;justify-content:space-between;align-items:baseline}
.score b{font-weight:500}.score small{color:var(--muted)}
.ticks{display:flex;gap:4px;margin-top:8px}.ticks i{flex:1;height:6px;border-radius:2px;background:var(--track)}.ticks i.on{background:var(--ink)}
.del{margin-top:16px;height:44px;color:var(--muted);font-size:13px}
/* 01 лист */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:12px 24px 34px;transform:translateY(103%);z-index:11}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet .pic{height:190px;border-radius:16px;overflow:hidden;background:var(--track);margin-bottom:16px}
/* 02 экран */
.full{position:absolute;inset:0;background:var(--bg);transform:translateX(104%);z-index:11;overflow:hidden}
.full.on{transform:none}
.full .hero{position:absolute;left:0;right:0;top:0;height:330px;background:var(--track)}
.full .back{position:absolute;left:16px;top:44px}
.full .card{position:absolute;left:0;right:0;top:298px;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:22px 24px}
/* 03 лента */
.film{position:absolute;inset:0;background:var(--bg);transform:translateY(104%);z-index:11}
.film.on{transform:none}
.film .hd{display:flex;justify-content:space-between;align-items:center;padding:46px 24px 0}
.pager{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 24px;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center}
.slide .pic{height:300px;border-radius:18px;overflow:hidden;background:var(--track)}
.slide .cap{margin-top:12px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
.film .info{padding:0 24px}
</style>
</head>
<body>
<div class="top">
  <b>Еда: запись с фото</b>
  <p>Фото хранится только на телефоне и удаляется вместе с записью. В списке у записи с фото появляется миниатюра, у остальных ничего нет. Нажмите на запись «Куриная печень с луком», чтобы открыть её. Фото здесь условное, в приложении будет ваш снимок.</p>
</div>

<div class="layout" id="root"></div>

<script>
// условные «фото»: разные тарелки
const plate=(c1,c2,c3)=>`<svg class="ph" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<rect width="320" height="200" fill="currentColor" opacity=".05"/>
<circle cx="160" cy="100" r="78" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".5"/>
<circle cx="160" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="1" opacity=".22"/>
<path d="M112 108c6-30 44-40 60-20 14 18 6 40-18 46-22 5-48-6-42-26z" fill="currentColor" opacity="${c1}"/>
<rect x="176" y="70" width="52" height="30" rx="12" fill="currentColor" opacity="${c2}"/>
<circle cx="132" cy="136" r="9" fill="currentColor" opacity="${c3}"/><circle cx="152" cy="144" r="7" fill="currentColor" opacity="${c3}"/><circle cx="108" cy="116" r="6" fill="currentColor" opacity="${c3}"/>
</svg>`;
const P=[plate(.18,.3,.4),plate(.3,.16,.34),plate(.22,.36,.26)];
const E=[
 {t:'00:01',n:'Куриная печень с луком',k:621,m:'Б 61 · Ж 36 · У 11',p:0,s:7,w:'Сегодня, 00:01'},
 {t:'14:20',n:'Гречка с курицей',k:484,m:'Б 45 · Ж 16 · У 38',p:1,s:7,w:'Вчера, 14:20'},
 {t:'09:05',n:'Овсянка с бананом',k:320,m:'Б 10 · Ж 6 · У 58',p:null,w:''},
 {t:'19:40',n:'Омлет с овощами',k:390,m:'Б 24 · Ж 28 · У 6',p:2,s:8,w:'9 ноября, 19:40'},
];
const cam='<svg class="ic" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.1-1.6A1 1 0 0 1 9.6 5h4.8a1 1 0 0 1 .8.4L16.3 7h2.2A1.5 1.5 0 0 1 20 8.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.2"/></svg>';
const x='<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const back='<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const ticks=s=>'<div class="ticks">'+Array.from({length:10},(_,i)=>`<i class="${i<s?'on':''}"></i>`).join('')+'</div>';
const info=(e,withName=true)=>`<div class="info">${withName?`<div class="name">${e.n}</div><div class="when">${e.w}</div><div style="height:12px"></div>`:''}
 <div class="big">${e.k}<small>ккал</small></div>
 <div class="mac">${e.m.split(' · ').map(s=>`<div><b>${s.slice(2)} г</b><span>${{'Б':'белки','Ж':'жиры','У':'углеводы'}[s[0]]}</span></div>`).join('')}</div>
 <div class="score"><div class="r"><b>Польза ${e.s} из 10</b><small>ориентир</small></div>${ticks(e.s)}</div>
 <button class="del">Удалить запись</button></div>`;
const rows=(open)=>`<div class="pad"><div class="ttl">Еда</div><div class="date">Вторник, 10 ноября</div>
 <div class="sec">Сегодня</div>
 ${E.map((e,i)=>`<button class="row" ${e.p!==null?`data-open="${i}"`:''} aria-label="${e.n}, ${e.k} ккал${e.p!==null?', открыть фото':''}">
   <span class="tm">${e.t}</span>
   <span class="th ${e.p===null?'none':''}">${e.p===null?'':P[e.p]}</span>
   <span class="nm"><div>${e.n}</div><small>${e.m}</small></span><b>${e.k}</b></button>`).join('')}
 <div class="hint">Записи без фото открываться не будут, как сейчас.</div></div>`;

const root=document.getElementById('root');
const col=(h,s,inner)=>`<div class="col"><h2>${h}</h2><p class="sub">${s}</p><div class="device"><div class="screen">${inner}</div></div></div>`;

root.innerHTML=
col('01 «Лист»','Фото в листе снизу, как окно добавления записи. Быстро открыть и смахнуть вниз.',
 rows()+`<div class="scrim" data-s="1"></div>
 <div class="sheet ease" data-sheet="1"><div class="grab"></div><div class="pic" style="color:var(--ink)">${P[0]}</div>${info(E[0])}</div>`)+
col('02 «Экран»','Отдельный экран: фото крупно на всю ширину, данные на карточке снизу. Кнопка «назад» поверх фото.',
 rows()+`<div class="full ease" data-full="1"><div class="hero" style="color:var(--ink)">${P[0]}</div>
 <button class="back circ" data-close aria-label="Назад">${back}</button>
 <div class="card">${info(E[0])}</div></div>`)+
col('03 «Лента»','Фото как прогресс: листаются свайпом между всеми снимками, от новых к старым. Подпись и итоги меняются вместе с кадром.',
 rows()+`<div class="film ease" data-film="1"><div class="hd"><div class="ttl" style="font-size:22px">Фото еды</div>
 <button class="circ" data-close aria-label="Закрыть">${x}</button></div>
 <div class="pager" id="pager">${[0,1,3].map(i=>`<div class="slide"><div class="pic" style="color:var(--ink)">${P[E[i].p]}</div>
 <div class="cap"><div style="font-size:18px;font-weight:600">${E[i].n}</div><div class="when" style="color:var(--muted)">${E[i].w}</div></div></div>`).join('')}</div>
 <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
 <div class="info" id="filmInfo" style="margin-top:14px">${info(E[0],false)}</div></div>`);

const close=scr=>{
  scr.querySelector('.scrim')?.classList.remove('on');
  scr.querySelector('[data-sheet]')?.classList.remove('on');
  scr.querySelector('[data-full]')?.classList.remove('on');
  scr.querySelector('[data-film]')?.classList.remove('on');
};
document.querySelectorAll('.screen').forEach(scr=>{
  scr.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{
    scr.querySelector('.scrim')?.classList.add('on');
    scr.querySelector('[data-sheet]')?.classList.add('on');
    scr.querySelector('[data-full]')?.classList.add('on');
    scr.querySelector('[data-film]')?.classList.add('on');
  }));
  scr.querySelector('.scrim')?.addEventListener('click',()=>close(scr));
  scr.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>close(scr)));
});
// лента: итоги следуют за кадром
const pager=document.getElementById('pager'),dots=[...document.querySelectorAll('#dots i')],fi=document.getElementById('filmInfo');
const order=[0,1,3];
pager.addEventListener('scroll',()=>{
  const i=Math.round(pager.scrollLeft/pager.clientWidth);
  dots.forEach((d,j)=>d.classList.toggle('on',j===i));
  fi.innerHTML=info(E[order[i]],false);
});
</script>
</body>
</html>
